stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# --------------- Test Stage ---------------

lint:
  stage: test
  image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - ruff check src/ tests/

typecheck:
  stage: test
  image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - mypy src/ --ignore-missing-imports
  allow_failure: true

unit-tests:
  stage: test
  image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-fail-under=50
  artifacts:
    reports:
      junit: junit.xml
    when: always

# --------------- Build Stage ---------------

build-image:
  stage: build
  image: docker:24@sha256:9b17a9f25adf17b88d0a013b4f00160754adf4b07ccbe9986664a49886c2c98e
  services:
    - docker:24-dind@sha256:9b17a9f25adf17b88d0a013b4f00160754adf4b07ccbe9986664a49886c2c98e
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
