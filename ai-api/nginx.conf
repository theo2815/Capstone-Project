upstream api {
    server ai-api:8000;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # For Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    # Redirect all other HTTP traffic to HTTPS (enable after SSL setup)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Temporary: serve directly on HTTP until SSL is configured
    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must equal MAX_REQUEST_BODY in src/config.py — the app enforces the same
        # ceiling, and TestBodySizeLimit parses this line to keep the two in step.
        # Sized by the backend's mega drain at its worst case: 50 photos per job
        # (its batch.max-size) x the 25 MB MAX_FILE_SIZE ceiling = 1250 MB, which
        # the previous 1024M did not cover.
        client_max_body_size 2048M;

        # Timeouts for ML inference
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;
    }

    # Health check (no rate limit). Nothing to switch off: limit_req is set
    # inside `location /`, and this longer prefix wins the match, so a health
    # request never enters that block and never inherits the limit. There is
    # also no `off` parameter for limit_req — `limit_req off;` here made the
    # whole file unparseable ([emerg] invalid parameter "off").
    location /api/v1/health {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }
}

