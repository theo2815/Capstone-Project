services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    # Loopback only. nginx reaches this over the compose network as ai-api:8000
    # and needs no published port; binding 0.0.0.0 put the app on the public
    # interface alongside the proxy, so nginx's rate limit, its 2 GB
    # client_max_body_size and (once enabled) its TLS were all bypassable by
    # hitting :8000 directly. That is also why an nginx.conf which could not
    # parse went unnoticed for months. Matches db/redis below.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/quickpitik
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MODEL_DIR=/app/models
      - BLOB_STORE_PATH=/data/blobs
      - LOG_LEVEL=INFO
      - DEBUG=false
      - ENVIRONMENT=production
      - WORKERS=2
      - USE_GPU=false
      # No default. This was `${ALLOWED_ORIGINS:-["*"]}`, so a deploy that simply
      # forgot the variable got wildcard CORS in production while
      # docs/security.md specified named origins. Unset is now a startup error.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS to your production origins, e.g. ["https://quickpitik.com"]}
      # Fernet key for webhook secrets at rest. Must be identical across the API
      # and EVERY worker: the API encrypts (webhook_repo) and blur/face/bib
      # workers decrypt in complete_job/fail_job (workers/helpers). A partial
      # rollout is worse than none — signatures break instead of degrading.
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    volumes:
      # The ONLY way weights reach a container. The image carries manifest.json
      # and nothing else (see Dockerfile + .dockerignore). Without this mount
      # blur_classifier and bib_detector are absent — and because both are
      # "optional" in the registry, /health/ready still returned 200 while every
      # /blur/classify* route, the desktop's primary path, failed.
      - ./models:/app/models:ro
      - blobstore:/data/blobs
    deploy:
      resources:
        limits:
          memory: 8G

  # --- Per-queue specialized workers (T1-1) ---
  # Each worker serves exactly one queue and loads only the models it needs (T1-2).
  # Blur gets concurrency=4 (fast ~18ms tasks); face/bib get 2 (heavy models).
  # Scale a queue: docker compose up --scale celery-blur=2

  celery-blur:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=4 -Q blur -n blur@%h
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/quickpitik
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MODEL_DIR=/app/models
      - BLOB_STORE_PATH=/data/blobs
      - USE_GPU=false
      - WORKER_QUEUES=blur
      # Decrypts webhook secrets in complete_job/fail_job — must match the API's.
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-}
      - OMP_NUM_THREADS=2
      - ONNX_INTRA_OP_THREADS=2
      - ONNX_INTER_OP_THREADS=2
    depends_on:
      - ai-api
    restart: unless-stopped
    volumes:
      # Workers load their own models (model_loader.py, queue-aware), so they
      # need the same host mount the API does — see the note on ai-api.
      - ./models:/app/models:ro
      - blobstore:/data/blobs
    deploy:
      resources:
        limits:
          memory: 4G

  celery-face:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2 -Q face -n face@%h
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/quickpitik
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MODEL_DIR=/app/models
      - BLOB_STORE_PATH=/data/blobs
      - USE_GPU=false
      - WORKER_QUEUES=face
      # Decrypts webhook secrets in complete_job/fail_job — must match the API's.
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-}
    depends_on:
      - ai-api
    restart: unless-stopped
    volumes:
      # Workers load their own models (model_loader.py, queue-aware), so they
      # need the same host mount the API does — see the note on ai-api.
      - ./models:/app/models:ro
      - blobstore:/data/blobs
    deploy:
      resources:
        limits:
          memory: 6G

  celery-bib:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2 -Q bib -n bib@%h
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/quickpitik
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MODEL_DIR=/app/models
      - BLOB_STORE_PATH=/data/blobs
      - USE_GPU=false
      - WORKER_QUEUES=bib
      # Decrypts webhook secrets in complete_job/fail_job — must match the API's.
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-}
      - OCR_MAX_WORKERS=8
    depends_on:
      - ai-api
    restart: unless-stopped
    volumes:
      # Workers load their own models (model_loader.py, queue-aware), so they
      # need the same host mount the API does — see the note on ai-api.
      - ./models:/app/models:ro
      - blobstore:/data/blobs
    deploy:
      resources:
        limits:
          memory: 4G

  celery-default:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2 -Q default -n default@%h
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/quickpitik
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MODEL_DIR=/app/models
      - BLOB_STORE_PATH=/data/blobs
      - USE_GPU=false
      - WORKER_QUEUES=default
      # This queue runs the webhooks.* retry tasks (celery_app task_routes).
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-}
    depends_on:
      - ai-api
    restart: unless-stopped
    volumes:
      # Workers load their own models (model_loader.py, queue-aware), so they
      # need the same host mount the API does — see the note on ai-api.
      - ./models:/app/models:ro
      - blobstore:/data/blobs
    deploy:
      resources:
        limits:
          memory: 2G

  db:
    image: pgvector/pgvector:pg16
    # PostgreSQL tuning for pgvector + HNSW workload (T2-4)
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=256MB
      -c work_mem=32MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_wal_size=1GB
    environment:
      POSTGRES_DB: quickpitik
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - ai-api
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done'"

volumes:
  pgdata:
  redisdata:
  blobstore:
  certbot-etc:
  certbot-var:
