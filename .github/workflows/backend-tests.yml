name: backend-tests

on:
  push:
    branches: [dev-main, main]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  # Every PR runs this workflow: dev-main requires unit + integration to pass, and a check
  # that never starts would block a website-only PR. The changes job skips them instead.
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(backend/|\.github/workflows/backend-tests\.yml$)'; then
            echo backend=true >> "$GITHUB_OUTPUT"
          else
            echo backend=false >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Docker-free by contract (backend/AGENTS.md): everything needing Postgres is
      # tagged "integration" and excluded here. Same command the module docs record
      # by hand; this is the first time anything runs it unattended.
      - run: ./gradlew test --console=plain --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-unit-test-report
          path: backend/build/reports/tests/test

  integration-shard:
    # ubuntu-latest ships a Docker daemon; Testcontainers starts postgres:16-alpine.
    # Budget ~35 s for PhotoBundleHttpIntegrationTest's deliberate streaming-timeout
    # sleep. The two Rekognition smoke classes self-skip without AWS credentials.
    # The suite is split over 4 machines (see itShards in build.gradle.kts).
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew integrationTest -PitShards=4 -PitShard=${{ matrix.shard }} --console=plain --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results-${{ matrix.shard }}
          path: backend/build/test-results/integrationTest/*.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-integration-test-report-${{ matrix.shard }}
          path: backend/build/reports/tests/integrationTest

  # The check dev-main requires. It fails unless the change check ran and, when backend/
  # changed, every shard passed (a skipped shard after a failed change check is not a pass).
  integration:
    needs: [changes, integration-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.changes.result }}" = success ]
          [ "${{ needs.changes.outputs.backend }}" != true ] || [ "${{ needs.integration-shard.result }}" = success ]
