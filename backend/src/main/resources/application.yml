spring:
  application:
    name: quickpitik-backend
  mvc:
    async:
      # Event-sized original downloads routinely exceed the servlet default.
      request-timeout: ${HTTP_STREAM_TIMEOUT:30m}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickpitik}
    username: ${DB_USER:quickpitik}
    password: ${DB_PASSWORD:quickpitik}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Boot default is 10. Raise via DB_POOL_SIZE if marathon-day upload
      # concurrency ever saturates it (watch hikaricp.connections.* metrics).
      maximum-pool-size: ${DB_POOL_SIZE:10}
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Collapses the EAGER @ElementCollection fan-out (Photo.bibs /
        # Photo.facePersons, Event.categories): N per-row collection selects
        # become ceil(N/50) IN-selects. A 200-photo grid page drops from
        # ~401 queries to ~13.
        default_batch_fetch_size: 50
        order_inserts: true
        query:
          in_clause_parameter_padding: true
        jdbc:
          time_zone: UTC
          batch_size: 25
  task:
    scheduling:
      # Boot default is 1 thread, which let a slow indexing reconcile sweep
      # starve the reaper / batch drain / poll / photos-ready sweeps.
      pool:
        size: 6
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Multipart upload limits — sized for photographer originals (typical
  # 8–20 MB JPEGs from a Sony α7 IV / Canon R6). Avatars + selfies stay well
  # under this. The photographer-upload rate limiter (600/min) caps abuse.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
      # Spool photo uploads to java.io.tmpdir instead of buffering them in heap.
      # At 25MB every 8–20MB original sat fully in memory, so mass concurrent
      # uploads OOM-killed the container at the first live event (2026-09-05).
      # Prod also carries SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD on Railway;
      # see vault backend/decisions.md 2026-09-05 (event).
      file-size-threshold: 1MB

server:
  port: ${SERVER_PORT:8080}
  # Behind a TLS-terminating proxy (Railway). Honours X-Forwarded-For/-Proto so
  # remoteAddr (per-IP rate-limit keys), isSecure() and HSTS see the real client.
  forward-headers-strategy: framework
  # Dev: localhost is a shared cookie jar across every local dev server (e.g. a
  # Supabase auth-token cookie ~2.5KB from another local app). <img> requests to
  # /storage carry those cookies and blow past Tomcat's 8KB default, 503-ing image loads.
  max-http-request-header-size: 64KB
  error:
    include-message: never
    include-stacktrace: never

jwt:
  # Production: set JWT_SECRET to a 256-bit random value, e.g. `openssl rand -base64 64`.
  secret: ${JWT_SECRET:dev-only-secret-DO-NOT-USE-IN-PRODUCTION-replace-with-32-byte-random}
  access-token-ttl: PT15M
  refresh-token-ttl: P7D
  # A refresh token presented again within this window after it was rotated is
  # given one more token, while the token it was rotated into is still live.
  # Covers a lost rotation answer and two browser tabs refreshing at once.
  refresh-rotation-grace: ${JWT_REFRESH_ROTATION_GRACE:PT10M}

app:
  admin-action:
    lease: ${ADMIN_ACTION_LEASE:5m}
  photo-removal:
    photographer-response-window: PT72H
    cleanup-interval: ${PHOTO_REMOVAL_CLEANUP_INTERVAL:PT1M}
    cleanup-backoff: ${PHOTO_REMOVAL_CLEANUP_BACKOFF:PT5M}
    in-request-cleanup-jobs: ${PHOTO_REMOVAL_IN_REQUEST_CLEANUP_JOBS:5}
    email-sweep-interval: ${PHOTO_REMOVAL_EMAIL_SWEEP_INTERVAL:PT15M}
    runner:
      liveness-pass-min: ${RUNNER_REMOVAL_LIVENESS_PASS:90}
      liveness-uncertain-min: ${RUNNER_REMOVAL_LIVENESS_UNCERTAIN:50}
      auto-hide-min-similarity: ${RUNNER_REMOVAL_AUTO_HIDE_SIMILARITY:0.99}
      auto-hide-max-per-request: ${RUNNER_REMOVAL_AUTO_HIDE_MAX:30}
      photographer-daily-auto-hides: ${RUNNER_REMOVAL_PHOTOGRAPHER_DAILY:50}
      candidate-limit: ${RUNNER_REMOVAL_CANDIDATE_LIMIT:50}
      email-claim-stale-after: ${RUNNER_REMOVAL_EMAIL_CLAIM_STALE_AFTER:PT10M}
      checks-per-day: ${RUNNER_REMOVAL_CHECKS_PER_DAY:3}
      max-open-requests: ${RUNNER_REMOVAL_MAX_OPEN:3}
  security:
    origin-secret: ${ORIGIN_SECRET:}
  # Externally-reachable URLs the BE needs to embed in artifacts whose request
  # context can't tell it about (e.g. the receipt email). When running ngrok
  # for cross-device download testing, set PUBLIC_API_BASE_URL alongside
  # STORAGE_PUBLIC_BASE_URL so the email button reaches the BE through the
  # same tunnel as the storage links.
  public:
    api-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8080/api/v1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Temporary account lockout (V29). Complements the per-IP auth-login bucket
    # below rather than replacing it: that one caps how fast one host may guess,
    # this one caps how often one ACCOUNT may be guessed at regardless of source,
    # and it stays on even when RATE_LIMIT_ENABLED is false (the dev default).
    # A lock auto-clears after `duration`; raise max-attempts if a demo needs
    # more headroom.
    lockout:
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${AUTH_LOCKOUT_DURATION:PT15M}
      # NFR-S-14 (V34): failures only accumulate toward a lock when they land
      # within this window of the previous one; older streaks restart at 1.
      window: ${AUTH_LOCKOUT_WINDOW:PT15M}
    # "Continue with Google" (V38). The Web application OAuth client ID from
    # Google Cloud — shared audience for the website GIS button AND the mobile
    # Credential Manager exchange. Blank (dev default) makes /auth/google
    # answer 503 GOOGLE_AUTH_UNAVAILABLE; both clients hide the button when
    # their copy of the ID is unset, so the endpoint going dark is symmetric.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  # Privacy Policy / Terms version stamped on new sign-ups that tick the box
  # (V91). No env var on purpose: it changes with the text, in code. The
  # website's LEGAL_VERSION must equal it; "-draft" until the owner approves.
  legal:
    current-version: "1.5"
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@quickpitik.local}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:changeme123}
    bootstrap-name: ${ADMIN_BOOTSTRAP_NAME:QuickPitik Admin}
    # Q-A5 follow-up — flagging surface is enabled.
    flags-enabled: ${ADMIN_FLAGS_ENABLED:true}
  storage:
    operation-timeout: ${STORAGE_OPERATION_TIMEOUT:PT2M}
    backend: ${STORAGE_BACKEND:LOCAL}
    bucket: ${STORAGE_BUCKET:quickpitik-dev}
    region: ${STORAGE_REGION:ap-southeast-1}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: ${STORAGE_PATH_STYLE:false}
    local-root: ${STORAGE_LOCAL_ROOT:.storage}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    direct-upload:
      # Capability and rollout gates stay off until the real R2/browser/native
      # smoke proves signed length and create-only destination copy semantics.
      enabled: ${STORAGE_DIRECT_UPLOAD_ENABLED:false}
      website-enabled: ${STORAGE_DIRECT_UPLOAD_WEBSITE_ENABLED:false}
      put-ttl: ${STORAGE_DIRECT_UPLOAD_PUT_TTL:PT15M}
      intent-ttl: ${STORAGE_DIRECT_UPLOAD_INTENT_TTL:PT24H}
      max-bytes: ${STORAGE_DIRECT_UPLOAD_MAX_BYTES:26214400}
      max-pending-per-user: ${STORAGE_DIRECT_UPLOAD_MAX_PENDING_PER_USER:32}
      max-pending-bytes-per-user: ${STORAGE_DIRECT_UPLOAD_MAX_PENDING_BYTES_PER_USER:838860800}
      verification-concurrency: ${STORAGE_DIRECT_UPLOAD_VERIFICATION_CONCURRENCY:2}
      verification-per-photographer: ${STORAGE_DIRECT_UPLOAD_VERIFICATION_PER_PHOTOGRAPHER:2}
      summary-interval: ${STORAGE_DIRECT_UPLOAD_SUMMARY_INTERVAL:PT1M}
      verification-wait: ${STORAGE_DIRECT_UPLOAD_VERIFICATION_WAIT:PT10S}
      verification-waiters: ${STORAGE_DIRECT_UPLOAD_VERIFICATION_WAITERS:0}
      verification-lease: ${STORAGE_DIRECT_UPLOAD_VERIFICATION_LEASE:PT5M}
      cleanup-delay: ${STORAGE_DIRECT_UPLOAD_CLEANUP_DELAY:PT1H}
      cleanup-interval: ${STORAGE_DIRECT_UPLOAD_CLEANUP_INTERVAL:PT1M}
      cleanup-batch-size: ${STORAGE_DIRECT_UPLOAD_CLEANUP_BATCH_SIZE:100}
      cleanup-recheck-window: ${STORAGE_DIRECT_UPLOAD_CLEANUP_RECHECK_WINDOW:P7D}
  ai:
    # Which backend fulfils face + bib inference. `rekognition` (default) routes
    # face + bib to AWS Rekognition. `ai-api` targets the self-hosted ai-api
    # service under app.ai-api below, which serves blur only since 2026-10-16,
    # so its face/bib calls get 404s. The AI master on/off switch stays
    # app.ai-api.enabled; this only selects the provider.
    provider: ${AI_PROVIDER:rekognition}
    # AWS Rekognition config (used only when provider=rekognition). Credentials
    # come from the AWS default chain — AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
    # for local dev, or the instance/task role in production. Never put keys here.
    rekognition:
      operation-timeout: ${REKOGNITION_OPERATION_TIMEOUT:PT2M}
      region: ${AWS_REGION:ap-southeast-1}
      # AWS credentials — leave empty to use the default chain (env vars /
      # ~/.aws/credentials / instance role). For a plain dev machine, set them
      # in application-local.yml alongside the other secrets.
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      # One collection per event (prefix + eventId) = the isolation boundary.
      collection-prefix: ${REKOGNITION_COLLECTION_PREFIX:qp-event-}
      # Face-search floor, 0–1 (sent to Rekognition as *100). 0.8 ≈ AWS's
      # recommended identity-match floor; the client never searches looser.
      face-match-threshold: ${REKOGNITION_FACE_THRESHOLD:0.8}
      max-faces-per-image: 15
      bib-min-chars: 2
      max-image-dimension: 2048
  ai-api:
    # Master switch. Default is off until ai-api work begins — feature
    # development runs faster without 3-attempt retry backoff on every
    # upload + selfie. Flip to true (set AI_API_ENABLED=true) when ai-api
    # is running and you want face enrollment + bib OCR + selfie search.
    # When false:
    #   - Photo upload skips faces/bibs (photo still uploads, aiDetectionStatus="none")
    #   - Runner selfie upload skips quality gate (qualityScore=0)
    #   - Runner face-search returns 503 AI_API_UNAVAILABLE
    #   - Bib search still works (it's a DB query against photo_bibs — but
    #     that table will be empty until AI is on during upload)
    enabled: ${AI_API_ENABLED:false}
    base-url: ${AI_API_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:dev-only-ai-api-key-DO-NOT-USE-IN-PRODUCTION}
    connect-timeout: PT5S
    read-timeout: PT30S
    max-retries: 3
    backoff-base-millis: 500
    face-match-threshold-default: 0.6
    face-top-k-default: 5
    # Demo safety net: when true, an ai-api failure during face search returns
    # the event's WHOLE photo grid instead of an error. Off by default — that
    # response shows every runner's photos, which is the opposite of what face
    # search promises. Flip only for a live demo with ai-api stopped.
    search-fallback-on-error: ${AI_SEARCH_FALLBACK:false}
    bib-confidence-threshold-default: 0.7
    # Per-photo indexing retry budget + reconcile cadence. Transport-level
    # failures (provider unreachable) do NOT consume attempts — only semantic
    # failures (bad image, 4xx) do, so an outage self-heals via the reconciler.
    max-indexing-attempts: ${AI_MAX_INDEXING_ATTEMPTS:5}
    reconcile-interval-ms: ${AI_RECONCILE_INTERVAL_MS:60000}
    photos-ready-claim-ttl: ${AI_PHOTOS_READY_CLAIM_TTL:PT10M}
    # Face templates (an event's Rekognition collection) are deleted this long
    # after the event date, and face search on the event then answers 410
    # FACE_SEARCH_ENDED; bib search keeps working (legal review M2, 2026-11-04).
    face-retention: P6M
    face-expiry-sweep-interval-ms: 86400000   # daily
    # Phase C bulk indexing. PER_PHOTO (default) = Phase-B behaviour (one enroll
    # + one bib HTTP call per photo, off the upload request). BATCH stands that
    # down and drains PENDING photos per event into mega jobs + webhook/poll
    # ingest. Inert until flipped via INDEXING_MODE=batch.
    indexing-mode: ${INDEXING_MODE:per_photo}
    batch:
      max-size: 50              # photos per mega job (bounds drain memory; ai-api caps at 500)
      drain-interval-ms: 30000
      drain-grace-seconds: 60
      max-events-per-tick: 5
    webhook:
      # Prod-only — ai-api's SSRF guard rejects localhost, so dev runs poll-only
      # (the poll backstop is the durable ingest path either way).
      enabled: ${AI_WEBHOOK_ENABLED:false}
      public-url: ${AI_WEBHOOK_PUBLIC_URL:}
      hmac-secret: ${AI_WEBHOOK_HMAC_SECRET:}
      poll-interval-ms: 30000
      poll-grace-seconds: 90
  moderation:
    # AA-I11: photographer avatar, cover and watermark go through AWS
    # DetectModerationLabels (Rekognition, ap-southeast-1) before they are stored.
    # AI off or an AWS error = accepted + an admin flag; a blocked label = refused.
    # 0-1 like the other thresholds (sent as x100). [NOT MEASURED: set from AA-0.5]
    image-min-confidence: ${MODERATION_IMAGE_MIN_CONFIDENCE:0.8}
    # A label is blocked when its name or parent name is listed (taxonomy v6 + v7).
    # Swimwear, Alcohol, Tobacco, Drugs, Gambling, Rude Gestures stay off on purpose
    # (race kits, sponsor banners). Owner reviews this list.
    image-blocked-labels: ${MODERATION_IMAGE_BLOCKED_LABELS:Explicit Nudity,Explicit,Non-Explicit Nudity of Intimate parts and Kissing,Violence,Visually Disturbing,Hate Symbols}
  identity:
    # Auto-approval Plan 1. Off = today's upload rule (AA-I6 reads it).
    gate-enabled: ${IDENTITY_GATE_ENABLED:false}
    # The announced turn-on date (YYYY-MM-DD) shown to photographers; blank = none. An invalid date fails boot.
    gate-starts-on: ${IDENTITY_GATE_STARTS_ON:}
    # AWS Face Liveness sessions (create + read results) run here; CompareFaces stays in ap-southeast-1.
    liveness-region: ${LIVENESS_REGION:ap-southeast-5}
    # 0-100 (AWS's scale). Strict until measured. [NOT MEASURED: set from AA-0.4]
    liveness-min-confidence: ${LIVENESS_MIN_CONFIDENCE:95}
    face-min-similarity: ${FACE_MIN_SIMILARITY:99}
    # Live checks per photographer per Manila day (the durable rate limit for C1).
    liveness-attempts-per-day: ${LIVENESS_ATTEMPTS_PER_DAY:3}
    # IAM role quickpitik-liveness-browser (AA-0.2). Blank = the live check answers 503.
    liveness-role-arn: ${LIVENESS_ROLE_ARN:}
    liveness-credential-seconds: ${LIVENESS_CREDENTIAL_SECONDS:900}
    # The typed ID number is stored only as HMAC-SHA256(this, "<ID_TYPE>:<number>") (AA-I4).
    # Production refuses the dev value. Never rotate it casually: older rows stop matching.
    id-number-hmac-secret: ${ID_NUMBER_HMAC_SECRET:dev-only-id-number-hmac-secret}
    # A regex over the normalised number (uppercase, no spaces or dashes). Blank = no format check.
    # [NOT MEASURED: set from AA-0.5]
    id-number-formats:
      philsys: ${ID_NUMBER_FORMAT_PHILSYS:}
      drivers-license: ${ID_NUMBER_FORMAT_DRIVERS_LICENSE:}
      passport: ${ID_NUMBER_FORMAT_PASSPORT:}
      umid: ${ID_NUMBER_FORMAT_UMID:}
      prc: ${ID_NUMBER_FORMAT_PRC:}
      postal: ${ID_NUMBER_FORMAT_POSTAL:}
      voters: ${ID_NUMBER_FORMAT_VOTERS:}
    # POST /admin/identity-notice (AA-I22) mails one photographer at a time, at most this many a second.
    # [NOT MEASURED: Resend's rate limit]
    notice-send-per-second: ${IDENTITY_NOTICE_SEND_PER_SECOND:2}
  races:
    # AA-R1 (auto-approval Plan 2): shared race events. Off = today's flow; on lets
    # photographers create, join and edit races and set a race price.
    self-serve-enabled: ${SELF_SERVE_RACES_ENABLED:false}
    # A new race's date must fall within this window around today. [NOT MEASURED]
    date-window-past-days: ${RACE_DATE_WINDOW_PAST_DAYS:3}
    date-window-ahead-days: ${RACE_DATE_WINDOW_AHEAD_DAYS:90}
    # Races one photographer may create per Manila day before review. [NOT MEASURED]
    daily-create-cap: ${RACE_DAILY_CREATE_CAP:3}
    duplicate:
      # Tuned on the AA-R2 Cebu race-name fixture (2026-11-08).
      strong-score: ${RACE_DUP_STRONG_SCORE:0.85}
      medium-score: ${RACE_DUP_MEDIUM_SCORE:0.5}
      date-tolerance-days: ${RACE_DUP_DATE_TOLERANCE_DAYS:1}
    proof:
      min-photographers: ${RACE_PROOF_MIN_PHOTOGRAPHERS:2}
      # [NOT MEASURED: set from AA-0.6 review SQL 1]
      min-indexed-photos: ${RACE_PROOF_MIN_INDEXED_PHOTOS:20}
      min-bib-share: ${RACE_PROOF_MIN_BIB_SHARE:0.30}
      # Below this share of indexed photos the proof sweep only flags. [NOT MEASURED]
      min-indexed-share: ${RACE_PROOF_MIN_INDEXED_SHARE:0.5}
      sweep-interval-ms: ${RACE_PROOF_SWEEP_INTERVAL_MS:3600000}
      # Comma list; for these types a failed bib rule only flags. [NOT MEASURED: set from AA-0.5 cycling read rate]
      bib-flag-only-types: ${RACE_PROOF_BIB_FLAG_ONLY_TYPES:CYCLING}
    same-bib:
      min-shared-bibs: ${RACE_SAME_BIB_MIN_SHARED:30} # [NOT MEASURED]
    reports:
      hide-threshold: ${RACE_REPORT_HIDE_THRESHOLD:3} # distinct accounts; [NOT MEASURED]
  relevance:
    # Photo relevance kill switch, read through RelevanceSwitch. off = nothing runs;
    # record-only = relevance rows and admin alerts only; auto-hide = may hide, but runs as
    # record-only until app.admin.flags-enabled is on and both junk cut-offs are set.
    # Old names still boot: shadow = record-only; flag = version 1's flag mode (a Low batch
    # also opens or extends one admin flag; acts as shadow while app.admin.flags-enabled is off).
    # An unknown value stops the boot.
    mode: ${RELEVANCE_MODE:off}
    sweep-interval-ms: ${RELEVANCE_SWEEP_INTERVAL_MS:60000}
    quiet-minutes: ${RELEVANCE_QUIET_MINUTES:10}
    lookups-per-tick: ${RELEVANCE_LOOKUPS_PER_TICK:100}
    max-batches-per-tick: ${RELEVANCE_MAX_BATCHES_PER_TICK:5}
    rescore-minutes: ${RELEVANCE_RESCORE_MINUTES:60}
    settle-days: ${RELEVANCE_SETTLE_DAYS:7}
    lookup-timeout: ${RELEVANCE_LOOKUP_TIMEOUT:5s}
    copy:
      tight-distance: ${RELEVANCE_COPY_TIGHT_DISTANCE:4} # [NOT MEASURED: PE-0]
      weak-distance: ${RELEVANCE_COPY_WEAK_DISTANCE:8} # [NOT MEASURED: PE-0]
      min-hits: ${RELEVANCE_COPY_MIN_HITS:3} # [NOT MEASURED: PE-0]
      min-hit-share-percent: ${RELEVANCE_COPY_MIN_HIT_SHARE_PERCENT:5} # [NOT MEASURED: PE-0]
    date:
      window-days: ${RELEVANCE_DATE_WINDOW_DAYS:2} # [NOT MEASURED: PE-0]
      min-dated-photos: ${RELEVANCE_DATE_MIN_DATED_PHOTOS:10} # [NOT MEASURED: PE-0]
      outside-share-percent: ${RELEVANCE_DATE_OUTSIDE_SHARE_PERCENT:80} # [NOT MEASURED: PE-0]
    junk:
      # 0-100. Empty = not set; auto-hide stays record-only until both are set.
      blur-cutoff: ${RELEVANCE_JUNK_BLUR_CUTOFF:} # [NOT MEASURED: O7]
      dark-cutoff: ${RELEVANCE_JUNK_DARK_CUTOFF:} # [NOT MEASURED: O7]
  watermark:
    # Async watermark pipeline (2026-08-28): uploads insert photos as PROCESSING
    # and PhotoWatermarkTrigger generates the derivative + flips them LIVE off
    # the request thread. Same attempt semantics as indexing: only semantic
    # failures (undecodable bytes) consume the budget; transport failures leave
    # it intact so the reconcile sweep keeps re-driving them.
    max-attempts: ${WATERMARK_MAX_ATTEMPTS:5}
    reconcile-interval-ms: ${WATERMARK_RECONCILE_INTERVAL_MS:60000}
    # POST /public/photos/verify: max Hamming distance (of 64 pHash bits) that
    # still counts as the same photo. <= half of it reports "strong".
    verify-max-distance: ${WATERMARK_VERIFY_MAX_DISTANCE:12}
    # Seeds each preview's stripe geometry via HMAC(secret, photoId) so the
    # public photo id alone can't regenerate the layer. Keep it stable: a
    # change re-seeds every future render (existing previews are unaffected).
    seed-secret: ${WATERMARK_SEED_SECRET:dev-only-watermark-seed-DO-NOT-USE-IN-PRODUCTION}
  thumbnails:
    # One-off sweep (FS-10): adds the 800 px grid.jpg to photos published before
    # it existed, 50 a minute. Turn on, wait for "thumbnail backfill complete", turn off.
    backfill-enabled: ${THUMBNAIL_BACKFILL_ENABLED:false}
  photo-metadata:
    recovery-enabled: ${PHOTO_METADATA_RECOVERY_ENABLED:true}
    recovery-interval-ms: ${PHOTO_METADATA_RECOVERY_INTERVAL_MS:60000}
  rate-limit:
    # ON by default (decided 2026-08-27; closes the NFR-S-11 posture question).
    # Set RATE_LIMIT_ENABLED=false for load tests. The per-IP keys use
    # request.remoteAddr — behind a TLS-terminating proxy configure Tomcat's
    # RemoteIpValve (server.tomcat.remoteip.remote-ip-header +
    # internal-proxies) so remoteAddr reflects the real client; never trust
    # X-Forwarded-For raw (client-forgeable).
    enabled: ${RATE_LIMIT_ENABLED:true}
    photographer-upload:
      capacity: 600
      refill-period: PT1M
    public-gallery:
      capacity: 60
      refill-period: PT1M
    # NFR-S-11: face/bib photo search 30 req / 15 min. Each face search burns
    # AI inference, so it costs far more than an ordinary read. Greedy refill
    # = burst of 30, then ~1 token / 30 s.
    photo-search:
      capacity: 30
      refill-period: PT15M
    # NFR-S-11: auth endpoints 10 req / 15 min by source IP — burst of 10,
    # then ~1 token / 90 s. Anything past that is credential stuffing, email
    # bombing, or token brute-force, not a human retrying.
    auth-login:
      capacity: 10
      refill-period: PT15M
    auth-register:
      capacity: 10
      refill-period: PT15M
    auth-forgot-password:
      capacity: 10
      refill-period: PT15M
    auth-verify-reset-otp:
      capacity: 10
      refill-period: PT15M
    auth-reset-password:
      capacity: 10
      refill-period: PT15M
    # Guest checkout mints a PayMongo session per call — bound the burn rate.
    order-create:
      capacity: 10
      refill-period: PT1M
    order-read:
      capacity: 90
      refill-period: PT1M
    # `?verify=true` status checks retrieve the Payment Intent from PayMongo per hit.
    order-verify:
      capacity: 10
      refill-period: PT1M
    # Public coupon preview: one lookup + a page of photos per call; its own
    # bucket so typo'd "Apply" clicks can't drain the checkout bucket.
    coupon-preview:
      capacity: 30
      refill-period: PT1M
    # Public token-gated bundle download: one S3 GET per photo + zip CPU.
    bundle-download:
      capacity: 6
      refill-period: PT1M
    # Public per-photo download (bundle route with ?photo=, free-event
    # originals): one storage GET streamed through, no zip.
    photo-download:
      capacity: 30
      refill-period: PT1M
    # Authenticated small-file uploads (avatar / selfie / cover / watermark /
    # payout QR) share one per-user bucket.
    media-upload:
      capacity: 20
      refill-period: PT1M
    # Public photo verification: decode + pHash + Hamming scan per call.
    photo-verify:
      capacity: 10
      refill-period: PT15M
    # Refund-link sends per dispute (each one mails the runner), on top of the per-admin bucket.
    refund-link-per-dispute:
      capacity: 3
      refill-period: PT1H
    # Event and photographer reports per account (AA-R9).
    report:
      capacity: 10
      refill-period: PT1H
  platform:
    photo-price-php: ${PHOTO_PRICE_PHP:125}
    # AA-R11: a photographer's own race price is between the race price and this times it (owner D3).
    race-price-ceiling-multiplier: ${RACE_PRICE_CEILING_MULTIPLIER:2.0}
    # Wait between two race price changes. [NOT MEASURED]
    race-price-cooldown: ${RACE_PRICE_COOLDOWN:PT24H}
    platform-cut-rate: ${PLATFORM_CUT_RATE:0.25}
    # Largest photographer coupon (whole percent of the photographer's share).
    # The platform cut never moves, whatever this is set to.
    coupon-max-percent: ${COUPON_MAX_PERCENT:50}
    # Earnings clear (become withdrawable) this long after the sale. Also the
    # refund window: requests past it are refused, so no refund follows a payout.
    # Website copy mirrors it (website/src/lib/refund-policy.ts).
    payout-clearing-window: ${PAYOUT_CLEARING_WINDOW:P7D}
    # After any payout-account change, hold payout requests this long (anti-fraud:
    # a changed destination cannot be withdrawn to immediately).
    payout-account-cooldown: ${PAYOUT_ACCOUNT_COOLDOWN:PT24H}
    # Payouts >= this amount need a second admin's approval (dormant until 2+ admins).
    payout-two-person-threshold-php: ${PAYOUT_TWO_PERSON_THRESHOLD_PHP:10000}
    payout-step-up-enabled: ${PAYOUT_STEP_UP_ENABLED:false}
    disbursement-provider: ${PAYOUT_DISBURSEMENT_PROVIDER:manual}
    # Automated transfers above this are refused (409); InstaPay's ceiling by default.
    payout-max-per-transfer-php: ${PAYOUT_MAX_PER_TRANSFER_PHP:50000}
    # Upper bound for emailed bundle capabilities and migrated legacy tokens.
    # 366 days outlasts the one-year download grant (a leap year included), so a
    # link never dies before the purchase.
    share-token-ttl: ${SHARE_TOKEN_TTL:P366D}
    order-return-ttl: ${ORDER_RETURN_TOKEN_TTL:PT35M}
    order-capability-secret: ${ORDER_CAPABILITY_SECRET:dev-only-order-capability-secret-DO-NOT-USE-IN-PRODUCTION-replace-with-32-byte-random}
  webhooks:
    payment:
      # Production: set PAYMENT_WEBHOOK_HMAC_SECRET to a 256-bit random value,
      # e.g. `openssl rand -base64 64`, and share it with the provider's
      # webhook configuration. Provider signs the raw JSON body with this
      # secret (HMAC-SHA256, lowercase hex) and sends the digest in the
      # signature-header. WebhookSignatureVerifier rejects any request whose
      # header is missing, malformed, or fails constant-time comparison.
      hmac-secret: ${PAYMENT_WEBHOOK_HMAC_SECRET:dev-only-payment-webhook-secret-DO-NOT-USE-IN-PRODUCTION-replace-with-32-byte-random}
      signature-header: ${PAYMENT_WEBHOOK_SIGNATURE_HEADER:X-QuickPitik-Signature}
  payments:
    paymongo:
      # PayMongo Checkout Sessions wiring. Real secret + webhook signing
      # secret are env-driven (or via application-local.yml, gitignored).
      # The dev defaults are intentionally fake — a boot without proper
      # secrets will fail loudly at the first PayMongo call instead of
      # silently sending garbage. PayMongo uses HTTP Basic auth: secret
      # key as username, empty password. Webhook signing format is
      # `Paymongo-Signature: t=<unix>,te=<test_sig>,li=<live_sig>`.
      secret-key: ${PAYMONGO_SECRET_KEY:sk_test_dev-only-DO-NOT-USE-IN-PRODUCTION}
      webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:whsk_dev-only-DO-NOT-USE-IN-PRODUCTION}
      success-url: ${PAYMONGO_SUCCESS_URL:http://localhost:3000/orders/return}
      cancel-url: ${PAYMONGO_CANCEL_URL:http://localhost:3000/cart}
      # Mobile bridge URLs — used when CreateOrderRequest.clientPlatform=="android".
      # PayMongo redirects to these; MobileReturnController returns HTML that
      # opens quickpitik:// deep links to bring the user back into the app.
      mobile-success-url: ${PAYMONGO_MOBILE_SUCCESS_URL:http://10.0.2.2:8080/api/v1/orders/mobile-return}
      mobile-cancel-url: ${PAYMONGO_MOBILE_CANCEL_URL:http://10.0.2.2:8080/api/v1/orders/mobile-cancel}
      base-url: ${PAYMONGO_BASE_URL:https://api.paymongo.com/v1}
      disbursement-base-url: ${PAYMONGO_DISBURSEMENT_BASE_URL:https://api.paymongo.com/v2}
      transfer-source-number: ${PAYMONGO_TRANSFER_SOURCE_NUMBER:}
      transfer-source-name: ${PAYMONGO_TRANSFER_SOURCE_NAME:}
      transfer-source-bic: ${PAYMONGO_TRANSFER_SOURCE_BIC:}
      transfer-callback-url: ${PAYMONGO_TRANSFER_CALLBACK_URL:}
      transfer-rail: ${PAYMONGO_TRANSFER_RAIL:instapay}
      transfer-gcash-bic: ${PAYMONGO_TRANSFER_GCASH_BIC:}
      transfer-maya-bic: ${PAYMONGO_TRANSFER_MAYA_BIC:}
      transfer-gotyme-bic: ${PAYMONGO_TRANSFER_GOTYME_BIC:}
      connect-timeout: PT5S
      read-timeout: PT15S
      checkout-ttl: ${PAYMONGO_CHECKOUT_TTL:PT30M}
      refund-link-allowed-prefixes: ${PAYMONGO_REFUND_LINK_ALLOWED_PREFIXES:https://transfer.paymongo.com/}
      qrph-refund-window: ${PAYMONGO_QRPH_REFUND_WINDOW:P30D}
      refund-link-validity: ${PAYMONGO_REFUND_LINK_VALIDITY:P3D}
  disputes:
    # Deadlines behind each admin dispute's due time (DisputeQueueProperties).
    review-business-days: ${DISPUTE_REVIEW_BUSINESS_DAYS:3}
    refund-send-within: ${DISPUTE_REFUND_SEND_WITHIN:PT48H}
    link-expiring-soon: ${DISPUTE_LINK_EXPIRING_SOON:PT24H}
    refund-stuck-after: ${DISPUTE_REFUND_STUCK_AFTER:PT24H}
  email:
    resend:
      # Resend transactional email wiring. Free-tier dev sender
      # (`onboarding@resend.dev`) only delivers to the verified Resend
      # signup address — fine for wiring tests, swap to a verified
      # domain sender before guest checkout testing.
      api-key: ${RESEND_API_KEY:re_dev-only-DO-NOT-USE-IN-PRODUCTION}
      from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
      from-name: ${RESEND_FROM_NAME:QuickPitik}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      connect-timeout: PT5S
      read-timeout: PT15S
      receipt-sweep-interval-ms: ${RECEIPT_SWEEP_INTERVAL_MS:900000}

# Actuator: /actuator/health is a public liveness probe; metrics + info need
# an ADMIN bearer (SecurityConfig). Nothing else is exposed over the web.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Generated OpenAPI spec + Swagger UI (springdoc). ON by default: the point of
# the surface is local exploration and the adviser demo, and this service has no
# production deployment yet. Set API_DOCS_ENABLED=false when one exists —
# publishing a full route inventory to the internet is free reconnaissance.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    # Alphabetical instead of controller-declaration order — too many controllers
    # to scan in declaration order otherwise.
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    # INFO is the shipped default; set LOG_LEVEL_APP=DEBUG for local debugging.
    com.quickpitik: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
